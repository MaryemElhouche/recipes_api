name: Continuous Deployment

on:
  workflow_run:
    workflows: ["CI Pipeline with Security & Metrics"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myapi:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/myapi:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Deployment summary
        run: |
          echo "🚀 Docker image pushed:" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ secrets.DOCKERHUB_USERNAME }}/myapi:latest" >> $GITHUB_STEP_SUMMARY
          echo "- ${{ secrets.DOCKERHUB_USERNAME }}/myapi:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
