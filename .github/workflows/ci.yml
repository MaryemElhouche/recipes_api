name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Google Chrome
      run: |
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get update
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit pytest-cov

    # ============= BANDIT SECURITY SCAN =============
    - name: Run Bandit SAST scan
      run: |
        echo "🔍 Running Bandit security scan..."
        bandit -r . -x venv,__pycache__,tests -ll -f json -o bandit-report.json || true
        bandit -r . -x venv,__pycache__,tests -ll -f txt -o bandit-report.txt || true
        bandit -r . -x venv,__pycache__,tests -ll || true
        echo "✅ Bandit scan complete"
      continue-on-error: true

    - name: Upload Bandit JSON Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-json-report
        path: bandit-report.json

    - name: Upload Bandit TXT Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-txt-report
        path: bandit-report.txt

    # ============= START SERVICES =============
    - name: Start Backend API
      run: |
        echo "🚀 Starting FastAPI backend..."
        nohup python main.py > backend.log 2>&1 &
        echo $! > backend.pid
        sleep 10
        echo "✅ Backend started"
      continue-on-error: false

    - name: Verify Backend is running
      run: |
        echo "🔍 Checking backend health..."
        curl -f http://localhost:8000/ || (echo "❌ Backend not responding" && cat backend.log && exit 1)
        curl -f http://localhost:8000/metrics || echo "⚠️ Metrics endpoint issue"
        echo "✅ Backend is healthy"

    - name: Start Streamlit app
      run: |
        echo "🚀 Starting Streamlit frontend..."
        nohup streamlit run app.py --server.port 8501 --server.headless true > streamlit.log 2>&1 &
        echo $! > streamlit.pid
        sleep 15
        echo "✅ Streamlit started"

    - name: Verify Streamlit is running
      run: |
        echo "🔍 Checking Streamlit health..."
        curl -f http://localhost:8501 || (echo "⚠️ Streamlit not responding" && cat streamlit.log)
        echo "✅ Streamlit check complete"

    # ============= RUN TESTS =============
    - name: Run tests with coverage
      env:
        PROMETHEUS_DISABLE_CREATED_SERIES: "True"
      run: |
        echo "🧪 Running pytest..."
        pytest -v --cov=. --cov-report=xml --cov-report=html --cov-report=term-missing || true
        echo "✅ Tests complete"
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: |
          htmlcov/
          coverage.xml

    # ============= GENERATE TRAFFIC FOR METRICS =============
    - name: Generate test traffic
      run: |
        echo "📊 Generating traffic for metrics..."
        for i in {1..30}; do
          curl -s http://localhost:8000/ > /dev/null || true
          curl -s http://localhost:8000/recipes > /dev/null || true
          curl -s http://localhost:8000/metrics > /dev/null || true
          sleep 0.5
        done
        echo "✅ Traffic generation complete"

    # ============= OWASP ZAP SCANS =============
    - name: Run OWASP ZAP Baseline Scan (Backend)
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8000'
        fail_action: false
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a -j -I'
      continue-on-error: true

    - name: Upload ZAP Backend Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-backend-report
        path: |
          report_html.html
          report_json.json
        if-no-files-found: warn

    - name: Run OWASP ZAP Baseline Scan (Frontend)
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8501'
        fail_action: false
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a -j -I'
      continue-on-error: true

    - name: Upload ZAP Frontend Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: zap-frontend-report
        path: |
          report_html.html
          report_json.json
        if-no-files-found: warn

    # ============= EXPORT METRICS =============
    - name: Export Prometheus metrics
      if: always()
      run: |
        echo "📊 Exporting Prometheus metrics..."
        curl -s http://localhost:8000/metrics > prometheus-metrics.txt || echo "Could not export metrics"
        echo "✅ Metrics exported"

    - name: Upload Prometheus metrics
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: prometheus-metrics
        path: prometheus-metrics.txt

    # ============= SUMMARY =============
    - name: Generate Pipeline Summary
      if: always()
      run: |
        echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### ✅ Services Started" >> $GITHUB_STEP_SUMMARY
        echo "- Backend API: http://localhost:8000" >> $GITHUB_STEP_SUMMARY
        echo "- Streamlit: http://localhost:8501" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📊 Reports Generated" >> $GITHUB_STEP_SUMMARY
        echo "- Bandit Security Scan (JSON + TXT)" >> $GITHUB_STEP_SUMMARY
        echo "- OWASP ZAP Backend Scan" >> $GITHUB_STEP_SUMMARY
        echo "- OWASP ZAP Frontend Scan" >> $GITHUB_STEP_SUMMARY
        echo "- Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "- Prometheus Metrics Export" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📥 Download Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "All reports are available in the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY

    # ============= CLEANUP =============
    - name: Cleanup processes
      if: always()
      run: |
        echo "🧹 Cleaning up..."
        kill $(cat backend.pid) 2>/dev/null || true
        kill $(cat streamlit.pid) 2>/dev/null || true
        pkill -f "streamlit" || true
        pkill -f "python main.py" || true
        echo "✅ Cleanup complete"