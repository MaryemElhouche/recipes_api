name: CI Pipeline with Security & Metrics

on: [push, pull_request]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt bandit
      
      # ============= START BACKEND SERVICE =============
      - name: Start and Verify Backend
        run: bash .github/scripts/start-backend.sh

      # ============= RUN ALL SCANS =============
      - name: Run Prometheus Metrics Collection
        run: bash .github/scripts/prometheus-scan.sh

      - name: Run API Tests
        run: bash .github/scripts/run-tests.sh

      - name: Run Bandit Security Scan
        run: bash .github/scripts/bandit-scan.sh

      - name: Run OWASP ZAP Security Scan
        run: bash .github/scripts/zap-scan.sh

      - name: Generate Master Security Report
        run: bash .github/scripts/generate-master-report.sh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      # ============= UPLOAD ARTIFACTS =============
      - name: Upload Prometheus Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: prometheus-report
          path: reports/prometheus-report.html
          retention-days: 30

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: bandit-report
          path: reports/bandit-report.html
          retention-days: 30

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: zap-report
          path: reports/zap-report.html
          retention-days: 30

      - name: Upload Master Security Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: master-security-report
          path: reports/MASTER-SECURITY-REPORT.html
          retention-days: 30

      # ============= CLEANUP =============
      - name: Cleanup
        if: always()
        run: bash .github/scripts/cleanup.sh

      - name: Pipeline Summary
        if: always()
        run: bash .github/scripts/summary.sh