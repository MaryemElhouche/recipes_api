name: CI Pipeline with Security & Metrics

on: [push, pull_request]

jobs:
  test-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ============= CACHE PIP DEPENDENCIES =============
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ============= INSTALL DEPENDENCIES =============
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt bandit

      # ============= START BACKEND SERVICE =============
      - name: Start and Verify Backend
        run: bash .github/scripts/start-backend.sh

      # ============= RUN ALL SCANS =============
      - name: Run Prometheus Metrics Collection
        run: bash .github/scripts/prometheus-scan.sh

      - name: Run API Tests
        run: bash .github/scripts/run-tests.sh

      - name: Run Bandit Security Scan
        run: bash .github/scripts/bandit-scan.sh

      - name: Run OWASP ZAP Security Scan
        run: bash .github/scripts/zap-scan.sh

      - name: Generate Master Security Report
        run: bash .github/scripts/generate-master-report.sh
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}

      # ============= UPLOAD ARTIFACTS =============
      - name: Upload All Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            reports/prometheus-report.html
            reports/bandit-report.html
            reports/zap-report.html
            reports/MASTER-SECURITY-REPORT.html
          retention-days: 30

      # ============= CLEANUP =============
      - name: Cleanup
        if: always()
        run: bash .github/scripts/cleanup.sh

      - name: Pipeline Summary
        if: always()
        run: bash .github/scripts/summary.sh
