name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/upload-artifact@v4
    - name: Install Google Chrome
      run: |
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get update
        sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bandit SAST scan
      run: |
        pip install bandit
        bandit -r . -x venv,__pycache__ -ll

    - name: Start Streamlit app
      run: |
        nohup streamlit run app.py --server.port 8501 &
        sleep 10

    - name: Run tests
      run: |
        pytest -v

    # --- OWASP ZAP Baseline Scan: Backend (API) ---
    - name: Run OWASP ZAP Baseline Scan (Backend)
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8000'
        fail_action: false
        report: 'zap-backend-report.html'
      continue-on-error: true

    - name: Upload ZAP Backend Report
      uses: actions/upload-artifact@v4      
      with:
        name: zap-backend-report
        path: zap-backend-report.html

    # --- OWASP ZAP Baseline Scan: Frontend (Streamlit) ---
    - name: Run OWASP ZAP Baseline Scan (Frontend)
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8501'
        fail_action: false
        report: 'zap-frontend-report.html'
      continue-on-error: true

    - name: Upload ZAP Frontend Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-frontend-report
        path: zap-frontend-report.html